---
# Overrides on top of SearXNG's bundled defaults (use_default_settings).
# server.secret_key comes from SEARXNG_SECRET, generated at each start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: searxng
    search:
      # json is what Hermes' web_search calls (/search?format=json)
      formats:
        - html
        - json
    server:
      # LAN and in-cluster only; the limiter would also need a Valkey
      limiter: false
      public_instance: false
      image_proxy: true
