---
#   in-cluster: http://searxng.searxng.svc:8080
#   LAN:        http://<node-ip>:30888 (fixed NodePort, any node's IP)
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
spec:
  type: NodePort
  selector:
    app: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30888
      protocol: TCP
