---
# Starting config.yaml for Hermes. The init container copies it into the
# Hermes home only if none exists, so settings saved from the WebUI stick.
# To re-apply this file, delete config.yaml on the volume and restart the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config-seed
  namespace: hermes
data:
  config.yaml: |
    model:
      # The local llama.cpp server (llms/qwen3_8); it runs without an API key.
      # Matches llama-server's --alias.
      default: Qwen3.6-27B-Q6_K
      provider: custom
      base_url: http://qwen3-8-27b.qwen38.svc:8000/v1
      # llama-server's n_ctx (--ctx-size 131000, reported as 131072)
      context_length: 131072
    web:
      # apps/searxng, reached through SEARXNG_URL (set in the Deployment)
      search_backend: searxng
      # SearXNG can't fetch pages. Left unset, extract would autodetect
      # SearXNG too and fail, so pin Keenable's keyless free tier.
      extract_backend: keenable
