---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
# The login password (Secret hermes-webui) is created by hand, not from git:
#   kubectl -n hermes create secret generic hermes-webui \
#     --from-literal=HERMES_WEBUI_PASSWORD="$(openssl rand -base64 24)"
resources:
- namespace.yaml
- pvc.yaml
- configmap.yaml
- deployment.yaml
- service.yaml
# Temporary: keeps flux-system from pruning these objects while it stops
# applying this directory (see clusters/ryzen-build/kustomization.yaml).
# Only metadata is patched, so pod templates and workloads don't change.
patches:
- target:
    name: ".*"
  patch: |-
    apiVersion: v1
    kind: not-used
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
