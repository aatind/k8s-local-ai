---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: reloader
resources:
- namespace.yaml
- helmrepository.yaml
- helmrelease.yaml
# Temporary: keeps flux-system from pruning these objects while it stops
# applying this directory (see clusters/ryzen-build/kustomization.yaml).
# Only metadata is patched, so pod templates and workloads don't change.
patches:
- target:
    name: ".*"
  patch: |-
    apiVersion: v1
    kind: not-used
    metadata:
      name: not-used
      annotations:
        kustomize.toolkit.fluxcd.io/prune: disabled
