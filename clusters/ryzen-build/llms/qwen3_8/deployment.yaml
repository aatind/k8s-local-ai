---
# Radiance serving Qwen3.8-27B IQ4R-L-V4 (~17.4 GiB) on one AMD Radeon RX 7900 XTX
# (gfx1100, RDNA3, 24 GiB VRAM) via the libr3d kernel library.
#
# Replaces llama.cpp + Qwen3.6-27B Q6_K GGUF. Radiance is purpose-built for
# AMD GPUs — RDNA3 kernels (libr3d) target gfx11xx natively, no HSA override needed.
#
# Model: qwen3.8-27b-iq4r-l-v4.rad (17.4 GiB, IQR-V4 trellis quant, ~4.5 bits/weight)
#   - StillDeadcode's radiance-optimized container with weights, tokenizer, chat template
#   - IQ4R-L ("large" trellis) is the best quality that fits on one 24 GB card
#     with headroom for KV cache (i8, 250K context, 2 sequences) and compute buffers.
#   - Source: https://huggingface.co/StillDeadcode/qwen3.8-27b-iqr-v4
#
# Radiance config is in configmap.yaml (mounted as /etc/radiance/radiance.yaml).
# Server keys: tp=1, max-num-seqs=2, max-model-len=250000, kv-cache-dtype=i8.
#
# VRAM budget (24 GiB):
#   Weights (IQ4R-L):  ~17.4 GiB
#   KV cache (i8, 2 seq x 250K): ~3.8 GiB
#   Compute buffers + gpu-headroom: ~2.8 GiB
#
# API: OpenAI-compatible at /v1 (chat, completions), same port 8000 / NodePort 30800.
# Dashboard at http://<node-ip>:30800/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8-27b
  namespace: qwen38
  labels:
    app: qwen3-8-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-8-27b
  template:
    metadata:
      labels:
        app: qwen3-8-27b
    spec:
      nodeSelector:
        amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44    # video
          - 991   # render
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      initContainers:
        # Downloads the radiance model container (~17.4 GiB), resumes partial
        # downloads, and removes the old GGUF to free PVC space.
        - name: fetch-model
          image: curlimages/curl:8
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /cache/models
              # Remove old llama.cpp GGUF (21 GiB) — no longer needed
              rm -f /cache/models/Qwen3.6-27B-Q6_K.gguf
              # Download radiance model container (resumes if interrupted)
              url="https://huggingface.co/StillDeadcode/qwen3.8-27b-iqr-v4/resolve/main/qwen3.8-27b-iq4r-l-v4.rad"
              dest="/cache/models/qwen3.8-27b-iq4r-l-v4.rad"
              if [ -f "$dest" ]; then echo "Model present"; exit 0; fi
              curl -fL --retry 5 -C - -o "$dest.partial" "$url"
              mv "$dest.partial" "$dest"
              echo "Download complete: $(du -h $dest | cut -f1)"
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: radiance
          image: stilldeadcode/radiance:latest
          args:
            - --config
            - /etc/radiance/radiance.yaml
          env:
            - name: HOME
              value: /tmp
            # gfx1100 is natively supported by libr3d — do NOT set HSA_OVERRIDE_GFX_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # mlock() the 21 GiB of weights past RLIMIT_MEMLOCK
              # (--load-mode mlock; without it the lock fails and is skipped)
              add: ["IPC_LOCK"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 20Gi
            limits:
              amd.com/gpu: 1
              memory: 24Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
              readOnly: true
            - name: config
              mountPath: /etc/radiance
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen3-8-27b-cache
        - name: config
          configMap:
            name: radiance-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
