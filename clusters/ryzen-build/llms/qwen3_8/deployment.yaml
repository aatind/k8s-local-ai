---
# vLLM (ROCm) serving cyankiwi/Qwen3.8-27B-AWQ-INT4 on one AMD Radeon
# RX 7900 XTX (gfx1100, RDNA3, 24 GiB).
#
# Why vLLM: the checkpoint is compressed-tensors W4A16 safetensors (int4,
# asymmetric, group size 32), which llama.cpp can't load. Unlike the earlier
# mattbucci AWQ build, its quantization_config already lists the vision
# tower in "ignore", so it loads without a config.json patch. It carries no
# kv_cache_scheme, so the KV cache stays bf16 (fp8 KV is software-emulated
# on gfx1100 and measured ~2x slower here).
#
# VRAM budget (24 GiB x 0.95). Only 16 of the 64 layers use full attention
# (4 KV heads x 256), the rest are gated DeltaNet with a fixed-size state,
# so the KV cache costs 64 KiB/token at bf16. Weights by component, from
# the safetensors headers (19.6 GiB on disk):
#   MLP int4 9.2, DeltaNet 3.1, full attention 0.9          13.2 GiB
#   embed_tokens + lm_head, both bf16 (not quantized)        4.7 GiB
#   vision tower 0.9, MTP head 0.8: not loaded (see args)    0 GiB
#   resident weights                                       ~17.9 GiB
#   HIP runtime, activations (2048-token chunks), graphs    ~1 GiB
#   KV bf16                                                ~3.8 GiB -> ~60k tokens
# --max-model-len auto takes whatever the KV pool holds; the startup log
# prints it ("GPU KV cache size" / max_model_len). Pin it once known, so a
# later image bump can't quietly shrink it under Hermes' context_length.
#
# The repo is pinned to a commit; the init container downloads it once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8-27b
  namespace: qwen38
  labels:
    app: qwen3-8-27b
spec:
  replicas: 1
  # One GPU, one copy of the weights: stop the old pod before starting a new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-8-27b
  template:
    metadata:
      labels:
        app: qwen3-8-27b
    spec:
      nodeSelector:
        amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX
      # Non-root, read-only image. The AMD device plugin passes
      # /dev/kfd and /dev/dri/renderD* in with the host's group ownership,
      # so the pod needs those GIDs (check on the node: getent group render video).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44    # video
          - 991   # render
        # AMD recommends unconfined for ROCm (HSA uses NUMA syscalls the
        # default profile restricts).
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      initContainers:
        # Downloads the pinned snapshot once (~19.6 GiB) and resumes a partial
        # download. Also removes the previous llama.cpp GGUFs (~16.5 GiB):
        # both don't fit the 30Gi local-path volume, which can't be expanded.
        - name: fetch-model
          image: vllm/vllm-openai-rocm:v0.29.0@sha256:e5e47f6aaab675c252c381f0dac237b31b10d87bb74d092b07fb4065efd7f5a1
          command: ["python3", "-c"]
          args:
            - |
              import glob, os
              from huggingface_hub import snapshot_download
              for f in glob.glob("/cache/models/Qwen3.8-27B-*.gguf*"):
                  os.remove(f)
                  print("removed", f)
              snapshot_download(
                  "cyankiwi/Qwen3.8-27B-AWQ-INT4",
                  revision="e3a700906e6a73ba4290b1873dc2ba8198527ab5",
                  local_dir="/cache/models/Qwen3.8-27B-AWQ-INT4",
              )
          env:
            - name: HOME
              value: /tmp
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            # No Xet chunk cache: it would keep a second copy of the weights
            - name: HF_XET_CHUNK_CACHE_SIZE_BYTES
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: vllm
          # The vLLM project's ROCm build of 0.29.0 (2026-09-09), pinned by
          # digest. 10.7 GiB compressed; AMD's rocm/vllm builds are 23-29 GiB
          # and, extracted, filled the node's disk (containerd shares the
          # NVMe with the model volume).
          image: vllm/vllm-openai-rocm:v0.29.0@sha256:e5e47f6aaab675c252c381f0dac237b31b10d87bb74d092b07fb4065efd7f5a1
          command: ["vllm", "serve"]
          args:
            - /cache/models/Qwen3.8-27B-AWQ-INT4
            # The model name clients send
            - --served-model-name
            - qwen3.8-27b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - auto
            # vLLM checks free VRAM at startup and refuses to start if this
            # fraction isn't available. Each 0.01 is ~0.24 GiB, ~3.9k tokens.
            # Drop to 0.90 if the card also drives a display.
            - --gpu-memory-utilization
            - "0.95"
            # fp8 KV halves the per-token cost (~120k tokens), but gfx1100 has
            # no native fp8: an earlier vLLM run here measured it ~2x slower
            # per context token. Worth it only if long context beats speed.
            # - --kv-cache-dtype
            # - fp8
            # One user, one sequence: the whole KV pool goes to that request
            - --max-num-seqs
            - "1"
            - --cudagraph-capture-sizes
            - "1"
            # Text only: skips the vision encoder and frees its VRAM
            - --language-model-only
            # Thinking goes to the reasoning field; tool calls in Qwen3.8's
            # XML format. The wrong tool parser fails silently (calls come
            # back as prose).
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            # The checkpoint keeps the MTP head. Turning it on costs context:
            # 0.8 GiB of weights plus a 17th attention layer's KV (~13k
            # tokens of the ~60k); check vllm:spec_decode_num_accepted_tokens
            # on /metrics after turning it on.
            # - --speculative-config
            # - '{"method":"mtp","num_speculative_tokens":1}'
            #
            # Sampling comes from the checkpoint's generation_config.json
            # (temp 1.0, top-p 0.95, top-k 20: Qwen3.8's thinking-mode
            # recommendation). Requests can still override these.
          env:
            - name: HOME
              value: /tmp
            # torch.compile / Triton kernel caches on the volume, so restarts
            # skip recompiling
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: TRITON_CACHE_DIR
              value: /cache/triton
            - name: FLASH_ATTENTION_TRITON_AMD_ENABLE
              value: "TRUE"
            # Never reach out to the Hub at runtime: serve the local snapshot only
            - name: HF_HUB_OFFLINE
              value: "1"
            # gfx1100 is natively supported - do NOT set HSA_OVERRIDE_GFX_VERSION.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              amd.com/gpu: 1
              memory: 32Gi
          # The init container did the download; this is load, compile and
          # graph capture (slowest on the first start, before the caches exist).
          # /health refuses connections until the engine is up.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            # The API server and engine core talk over shared memory
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen3-8-27b-cache
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
