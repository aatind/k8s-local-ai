---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-27b
  namespace: qwen38
  labels:
    app: qwen38-27b
spec:
  type: ClusterIP
  selector:
    app: qwen38-27b
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-27b
  namespace: llm
  labels:
    app: qwen38-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-27b
  template:
    metadata:
      labels:
        app: qwen38-27b
    spec:
      securityContext:
        # ROCm needs access to the render node. Check the GID on the node:
        #   getent group render video
        supplementalGroups:
          - 44    # video
          - 991   # render  <-- verify this, it differs between distros
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # Pin a real tag rather than latest once you've validated one.
          image: rocm/vllm:latest
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - "mattbucci/Qwen3.8-27B-AWQ"
            - "--served-model-name"
            - "qwen3.8-27b"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--max-model-len"
            - "24576"
            # vLLM's memory profiling does not account for the gated-DeltaNet
            # recurrent state or the vision tower. If it OOMs on startup, LOWER
            # this rather than raising it.
            - "--gpu-memory-utilization"
            - "0.90"
            - "--max-num-seqs"
            - "32"
            - "--cudagraph-capture-sizes"
            - "1,2,4,8,16,32"
            # Qwen3.8 thinking + tool calling
            - "--reasoning-parser"
            - "qwen3"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "qwen3_coder"
          env:
            - name: HF_HOME
              value: /models
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "1"
            # Standard ROCm setup for this card.
            - name: FLASH_ATTENTION_TRITON_AMD_ENABLE
              value: "TRUE"
            # gfx1100 is natively supported — do NOT set HSA_OVERRIDE_GFX_VERSION.
            - name: VLLM_LOGGING_LEVEL
              value: INFO
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              amd.com/gpu: 1
              memory: 48Gi
              cpu: "8"
            requests:
              amd.com/gpu: 1
              memory: 24Gi
              cpu: "4"
          volumeMounts:
            - name: hf-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            # Fallback only — the device plugin normally handles these:
            # - name: kfd
            #   mountPath: /dev/kfd
            # - name: dri
            #   mountPath: /dev/dri
          # ~19 GB download plus AWQ load and CUDA-graph capture.
          # 60 * 30s = 30 minutes before the pod is declared failed.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        # - name: kfd
        #   hostPath:
        #     path: /dev/kfd
        #     type: CharDevice
        # - name: dri
        #   hostPath:
        #     path: /dev/dri
        #     type: Directory
