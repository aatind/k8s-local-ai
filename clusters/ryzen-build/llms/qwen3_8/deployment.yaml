---
# llama.cpp (ROCm) serving Qwen3.8-27B on one AMD Radeon RX 7900 XTX
# (gfx1100, RDNA3, 24 GiB), with DFlash2 speculative decoding.
#
# Why this stack on this card:
#   - NVFP4 weights / fp8 KV need Blackwell / MI300+; gfx1100 has neither,
#     so the target is a 4-bit GGUF (unsloth UD-Q4_K_M, ~15.3 GiB) and the
#     KV cache is q8_0.
#   - SGLang only supports CDNA (gfx942/gfx950) officially, and the earlier
#     vLLM + AWQ attempt here needed a config patch and capped out at ~24k
#     context (bf16 KV). llama.cpp ships a ROCm image built for gfx1100.
#   - DFlash2 draft (incoai/Qwen3.8-27B-DFlash2) as GGUF; llama.cpp
#     supports it (--spec-type draft-dflash) since PR #27342.
#
# VRAM budget (24 GiB). Only 16 of the 64 layers use full attention (4 KV
# heads x 256), the rest are gated DeltaNet with a fixed-size state:
#   target UD-Q4_K_M                    15.3 GiB
#   DFlash2 draft Q4_K_M                 1.1 GiB  (sliding window 2048: ~40 MB KV)
#   KV q8_0, 131072 tokens x 34 KiB      4.3 GiB
#   DeltaNet state, compute buffers     ~1.5 GiB
#                                      ~22.2 GiB -> ~1.5 GiB headroom
# The native 262144 context only fits with q4_0 KV (same ~4.5 GiB). Swap
# -c/-ctk/-ctv below if you want length over KV precision.
#
# Both files are pinned to a commit and checked by sha256 (llama.cpp's -hf
# can't pin a revision), so the init container downloads them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8-27b
  namespace: qwen38
  labels:
    app: qwen3-8-27b
spec:
  replicas: 1
  # One GPU, one copy of the weights: stop the old pod before starting a new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-8-27b
  template:
    metadata:
      labels:
        app: qwen3-8-27b
    spec:
      nodeSelector:
        amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX
      # Non-root, read-only image. The AMD device plugin passes
      # /dev/kfd and /dev/dri/renderD* in with the host's group ownership,
      # so the pod needs those GIDs (check on the node: getent group render video).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44    # video
          - 991   # render
        # Kept from the previous manifest: AMD recommends unconfined for ROCm
        # (HSA uses NUMA syscalls the default profile restricts).
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      initContainers:
        # Downloads the pinned GGUFs once (~16.5 GiB), resumes a partial
        # download, and rejects a file whose sha256 doesn't match.
        - name: fetch-models
          image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11681
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /cache/models
              fetch() {
                url="$1"; file="/cache/models/$2"; sha="$3"
                if [ -f "$file" ]; then echo "$2 present"; return; fi
                curl -fL --retry 5 -C - -o "$file.partial" "$url"
                echo "$sha  $file.partial" | sha256sum -c -
                mv "$file.partial" "$file"
              }
              fetch https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-UD-Q4_K_M.gguf \
                Qwen3.8-27B-UD-Q4_K_M.gguf \
                322e194ff79741c7baa497c240f677f54b201b0efab44ca8e50f122b39123482
              fetch https://huggingface.co/incoai/Qwen3.8-27B-DFlash2-GGUF/resolve/144eb06583b4fb0b6e54bc814b16a206a240f4d2/Qwen3.8-27B-DFlash2-Q4_K_M.gguf \
                Qwen3.8-27B-DFlash2-Q4_K_M.gguf \
                d169ad335929adc0d77e10e2523f968f3e75f547637ad739b0a137ccde111b5f
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: llama-server
          # Official llama.cpp ROCm 7.2.1 build; its target list includes
          # gfx1100. Pinned build (2026-10-16), DFlash2 support included.
          image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11681
          args:
            - --model
            - /cache/models/Qwen3.8-27B-UD-Q4_K_M.gguf
            # The model name clients send
            - --alias
            - qwen3.8-27b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Everything on the GPU, and no auto-fitting: with --fit on,
            # llama.cpp quietly moves layers to the CPU when VRAM runs short.
            # Fail loudly instead, then lower -c.
            - --n-gpu-layers
            - all
            - --fit
            - "off"
            - --ctx-size
            - "131072"
            # Quantized V cache needs flash attention
            - --flash-attn
            - "on"
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            # One user, one slot: the whole KV pool goes to that request
            - --parallel
            - "1"
            # Thinking goes to reasoning_content. Tool calls are parsed from
            # the GGUF's chat template; --jinja is on by default.
            - --reasoning-format
            - deepseek
            # DFlash2 speculative decoding; 7 draft tokens is the draft
            # publisher's setting for llama.cpp.
            - --spec-type
            - draft-dflash
            - --model-draft
            - /cache/models/Qwen3.8-27B-DFlash2-Q4_K_M.gguf
            - --spec-draft-ngl
            - all
            - --spec-draft-n-max
            - "7"
            # Qwen3.8's recommended thinking-mode sampling (model card);
            # llama.cpp's defaults differ (temp 0.8, top-k 40, min-p 0.05).
            # Requests can still override these.
            - --temp
            - "1.0"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0"
          env:
            - name: HOME
              value: /tmp
            # gfx1100 is natively supported - do NOT set HSA_OVERRIDE_GFX_VERSION.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Weights are read through the page cache on load; the prompt
          # cache (--cache-ram, default 8 GiB) lives in host RAM too.
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              amd.com/gpu: 1
              memory: 32Gi
          # The init container did the download; this is load only.
          # /health is 503 while loading, 200 once ready.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen3-8-27b-cache
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
