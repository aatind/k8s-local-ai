---
# vLLM on ROCm serving Devstral Small 2 24B (agentic coding, Apache 2.0)
# Target: single AMD Radeon RX 7900 XTX (gfx1100, RDNA3, 24 GiB)
#
# Expects to already exist in namespace qwen38:
#   - a PVC named hf-cache (>= 40Gi)
#   - a Service targeting the pod labels below on port 8080
#     NOTE: the labels changed from app=qwen38-27b to app=devstral.
#     Update your Service selector or the Service will match nothing.
#
# Why this model on this card: Devstral Small 2 is a dense transformer based on
# Mistral-Small-3.1 (40 layers, grouped-query attention). No gated DeltaNet, no
# mamba state, no hybrid KV manager — none of the machinery that made
# Qwen3.8-27B painful on RDNA3. At ~16 GiB it also leaves real KV headroom
# instead of the ~24k ceiling the 27B forced.
#
# NOTE: mistralai/Devstral-Small-2-24B-Instruct-2512 ships FP8 weights, which
# need MI300+ on the AMD side. gfx1100 has no native FP8, so a 4-bit build is
# required — that's what this manifest uses.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devstral
  namespace: qwen38
  labels:
    app: devstral
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: devstral
  template:
    metadata:
      labels:
        app: devstral
    spec:
      nodeSelector:
        amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX. Drop this if your
                                          # nodes aren't labelled — the amd.com/gpu
                                          # request places the pod anyway.
      securityContext:
        supplementalGroups:
          - 44    # video
          - 991   # render
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          # Must NOT be an mi300-tagged image: those carry gfx942 kernels only
          # and fail on gfx1100 with "HIP error: invalid device function".
          image: rocm/vllm:latest
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            # ~16 GiB AWQ 4-bit build of Devstral-Small-2-24B-Instruct-2512.
            # Alternative if this misbehaves — a mixed INT4/INT8 GPTQ build made
            # specifically for GPUs without native FP8, and tagged for ROCm:
            #   btbtyler09/Devstral-Small-2-24B-Instruct-INT4-INT8-Mixed-GPTQ
            # It trades some size and speed for accuracy, so expect less KV room.
            - "cyankiwi/Devstral-Small-2-24B-Instruct-2512-AWQ-4bit"
            - "--served-model-name"
            - "devstral"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            # 24B at 4-bit is ~16 GiB, leaving ~5-6 GiB for KV at util 0.90.
            # Mistral-Small-3.1 geometry (40 layers, 8 KV heads, head_dim 128)
            # costs ~160 KB/token at bf16, so ~32k is the realistic starting
            # point. Read the "GPU KV cache size" line at startup and adjust.
            - "--max-model-len"
            - "32768"
            - "--gpu-memory-utilization"
            - "0.90"
            # Single-user agent workload, matching your llama-server --parallel 1.
            # Raise both together if you want dsh running concurrent tool calls.
            - "--max-num-seqs"
            - "1"
            - "--cudagraph-capture-sizes"
            - "1"
            # Mistral's own recommendation for this model. NOT qwen3_coder —
            # the wrong parser is a silent failure: the model emits valid calls
            # and vLLM fails to parse them, so dsh just sees prose.
            - "--tool-call-parser"
            - "mistral"
            - "--enable-auto-tool-choice"
            # The 2512 build kept the Mistral-Small-3.1 vision encoder. You are
            # not using images from a coding harness, and disabling it reclaims
            # the tower's VRAM.
            - "--limit-mm-per-prompt"
            - '{"image": 0}'
            # If the engine trips over Mistral-format config detection (it reads
            # params.json rather than config.json), force the HF path:
            # - "--config-format"
            # - "hf"
            #
            # No --reasoning-parser here: Devstral is not a thinking-mode model,
            # so the qwen3 parser from the previous manifest does not apply.
            #
            # Leave --kv-cache-dtype unset (defaults to bf16 here). If you see
            # fp8 reaching the attention op, that's a compressed-tensors
            # checkpoint carrying a kv_cache_scheme — on RDNA3 that measured
            # ~2x slower per context-token than bf16.
            #
            # Mistral recommends temperature 0.15 for this model. Set that in
            # dsh, not here. The repo also ships CHAT_SYSTEM_PROMPT.txt, which
            # is worth feeding to the harness as the system prompt.
          env:
            - name: HF_HOME
              value: /models
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            # Standard ROCm setup for this card.
            - name: FLASH_ATTENTION_TRITON_AMD_ENABLE
              value: "TRUE"
            # gfx1100 is natively supported — do NOT set HSA_OVERRIDE_GFX_VERSION.
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            # - name: HUGGING_FACE_HUB_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: hf-token-secret
            #       key: token
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              amd.com/gpu: 1
              memory: 48Gi
              cpu: "8"
            requests:
              amd.com/gpu: 1
              memory: 24Gi
              cpu: "4"
          volumeMounts:
            - name: hf-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
          # ~16 GiB download plus load and graph capture on first start.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi