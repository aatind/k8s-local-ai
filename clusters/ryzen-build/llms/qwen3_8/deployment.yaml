---
apiVersion: v1
kind: Service
metadata:
  name: qwen38-27b
  namespace: qwen38
  labels:
    app: qwen38-27b
spec:
  type: ClusterIP
  selector:
    app: qwen38-27b
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen38-27b
  namespace: qwen38
  labels:
    app: qwen38-27b
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen38-27b
  template:
    metadata:
      labels:
        app: qwen38-27b
    spec:
      # # Requires the AMD GPU device plugin (or the AMD GPU Operator) on the node.
      # # It injects /dev/kfd and /dev/dri for you; the hostPath mounts below are
      # # only a fallback for clusters running neither.
      # nodeSelector:
      #   amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX. Drop or adjust if
      #                                     # your nodes aren't labelled by the operator.
      securityContext:
        # ROCm needs access to the render node. Check the GID on the node:
        #   getent group render video
        supplementalGroups:
          - 44    # video
          - 991   # render  <-- verify this, it differs between distros
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      hostNetwork: true
      hostIPC: true
      containers:
        - name: vllm
          # Pin a real tag rather than latest once you've validated one.
          image: rocm/vllm:latest
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - "julianmb/Qwen-3.8-27B-ROCmFP4-FAST-GGUF"
            # llama-server --alias
            # - "--served-model-name"
            # - "Qwen3.8-27B"
            # - "--host"
            # - "0.0.0.0"
            # llama-server --port 8080
            - "--port"
            - "8080"
            # vLLM's memory profiling does not account for the gated-DeltaNet
            # recurrent state or the vision tower. If it OOMs on startup, LOWER
            # this rather than raising it.
          env:
            - name: HF_HOME
              value: /models
            # HF_HUB_ENABLE_HF_TRANSFER is deprecated; this is its replacement.
            - name: HF_XET_HIGH_PERFORMANCE
              value: "1"
            # Standard ROCm setup for this card.
            - name: FLASH_ATTENTION_TRITON_AMD_ENABLE
              value: "TRUE"
            # gfx1100 is natively supported — do NOT set HSA_OVERRIDE_GFX_VERSION.
            - name: VLLM_LOGGING_LEVEL
              value: INFO
            # - name: HUGGING_FACE_HUB_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: hf-token
            #       key: token
          ports:
            - name: http
              containerPort: 8080
          resources:
            limits:
              amd.com/gpu: 1
              memory: 48Gi
              cpu: "8"
            requests:
              amd.com/gpu: 1
              memory: 24Gi
              cpu: "4"
          volumeMounts:
            - name: hf-cache
              mountPath: /models
            - name: shm
              mountPath: /dev/shm
            # Fallback only — the device plugin normally handles these:
            # - name: kfd
            #   mountPath: /dev/kfd
            # - name: dri
            #   mountPath: /dev/dri
          # ~19 GB download plus AWQ load and CUDA-graph capture.
          # 60 * 30s = 30 minutes before the pod is declared failed.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: hf-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        # - name: kfd
        #   hostPath:
        #     path: /dev/kfd
        #     type: CharDevice
        # - name: dri
        #   hostPath:
        #     path: /dev/dri
        #     type: Directory