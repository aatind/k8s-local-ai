---
# vLLM (ROCm) serving cyankiwi/Qwen3.8-27B-AWQ-INT4 on one AMD Radeon
# RX 7900 XTX (gfx1100, RDNA3, 24 GiB).
#
# Why vLLM: the checkpoint is compressed-tensors W4A16 safetensors (int4,
# asymmetric, group size 32), which llama.cpp can't load. Unlike the earlier
# mattbucci AWQ build, its quantization_config already lists the vision
# tower in "ignore", so it loads without a config.json patch.
#
# Context size, measured on this card (vLLM 0.29.0, --max-model-len auto,
# then a near-max prompt to confirm it doesn't OOM). Only 16 of the 64
# layers use full attention (4 KV heads x 256 -> 64 KiB/token at bf16);
# the rest are gated DeltaNet with a fixed-size state.
#   resident weights (vision tower is built anyway, and the RDNA W4A16
#   kernel unpacks the zero points to bf16)                   19.3 GiB
#   default (torch.compile + graphs) at 0.95: activation peak 2.4 GiB,
#     KV -0.67 GiB -> won't start; same with smaller batches/no prefix cache
#   --enforce-eager: activation peak 0.1 GiB
#     0.95 -> 2.2 GiB KV, 32k tokens
#     0.98 -> 2.9 GiB KV, 44,688 tokens                       <- used
#     0.98 + --kv-cache-dtype fp8 -> 89,376 tokens
# Speed at 0.98 (one request), decode / prefill:
#   bf16 at 1k context    19.6 tok/s / 800 tok/s
#   bf16 at 44k            2.1 tok/s / 460 tok/s (full prompt ~96 s)
#   fp8  at 1k context    18.0 tok/s / 790 tok/s
#   fp8  at 89k            0.8 tok/s / 224 tok/s (full prompt ~6.6 min)
# Decode attention falls back to a Triton kernel, so long context gets
# slow either way. fp8 has no calibrated scales in this checkpoint (scale
# 1.0); it's an opt-in for when 44k isn't enough.
# Don't leave VLLM_LOGGING_LEVEL=DEBUG on: it logs every op dispatch and
# slows decode ~250x.
#
# The repo is pinned to a commit; the init container downloads it once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8-27b
  namespace: qwen38
  labels:
    app: qwen3-8-27b
spec:
  replicas: 1
  # One GPU, one copy of the weights: stop the old pod before starting a new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-8-27b
  template:
    metadata:
      labels:
        app: qwen3-8-27b
    spec:
      nodeSelector:
        amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX
      # Non-root, read-only image. The AMD device plugin passes
      # /dev/kfd and /dev/dri/renderD* in with the host's group ownership,
      # so the pod needs those GIDs (check on the node: getent group render video).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44    # video
          - 991   # render
        # AMD recommends unconfined for ROCm (HSA uses NUMA syscalls the
        # default profile restricts).
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      initContainers:
        # Downloads the pinned snapshot once (~19.6 GiB) and resumes a partial
        # download. Also removes the previous llama.cpp GGUFs (~16.5 GiB):
        # local-path doesn't enforce the 30Gi, but the volume shares the
        # node's NVMe with containerd's images.
        - name: fetch-model
          image: vllm/vllm-openai-rocm:v0.29.0@sha256:e5e47f6aaab675c252c381f0dac237b31b10d87bb74d092b07fb4065efd7f5a1
          command: ["python3", "-c"]
          args:
            - |
              import glob, os
              from huggingface_hub import snapshot_download
              for f in glob.glob("/cache/models/Qwen3.8-27B-*.gguf*"):
                  os.remove(f)
                  print("removed", f)
              snapshot_download(
                  "cyankiwi/Qwen3.8-27B-AWQ-INT4",
                  revision="e3a700906e6a73ba4290b1873dc2ba8198527ab5",
                  local_dir="/cache/models/Qwen3.8-27B-AWQ-INT4",
              )
          env:
            - name: HOME
              value: /tmp
            # No Xet chunk cache: it would keep a second copy of the weights
            - name: HF_XET_CHUNK_CACHE_SIZE_BYTES
              value: "0"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            # Xet downloads buffer in memory; 4Gi was OOM-killed. Its
            # HF_XET_HIGH_PERFORMANCE mode needs even more, so it's off.
            limits:
              memory: 8Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: vllm
          # The vLLM project's ROCm build of 0.29.0 (2026-09-09), pinned by
          # digest. 10.7 GiB compressed; AMD's rocm/vllm builds are 23-29 GiB
          # and, extracted, filled the node's disk (containerd shares the
          # NVMe with the model volume).
          image: vllm/vllm-openai-rocm:v0.29.0@sha256:e5e47f6aaab675c252c381f0dac237b31b10d87bb74d092b07fb4065efd7f5a1
          command: ["vllm", "serve"]
          args:
            - /cache/models/Qwen3.8-27B-AWQ-INT4
            # The model name clients send
            - --served-model-name
            - qwen3.8-27b
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Measured ceiling at 0.98 is 44,688 (see header). Pinned, so a
            # change that shrinks the KV pool fails startup loudly instead of
            # quietly dropping below Hermes' context_length.
            - --max-model-len
            - "44000"
            # vLLM checks free VRAM at startup and refuses to start if this
            # fraction isn't available. Each 0.01 is ~0.24 GiB, ~3.9k tokens.
            # The card drives no display; if it ever does, drop to 0.95 and
            # --max-model-len to 32000.
            - --gpu-memory-utilization
            - "0.98"
            # No torch.compile or graphs: their 2.3 GiB of workspace is the
            # difference between 44k tokens and not starting at all
            - --enforce-eager
            # Doubles the context (set --max-model-len 88000 and Hermes'
            # context_length with it); see the header for the cost
            # - --kv-cache-dtype
            # - fp8
            # One user, one sequence: the whole KV pool goes to that request
            - --max-num-seqs
            - "1"
            # Smaller prefill chunks, smaller activation peak
            - --max-num-batched-tokens
            - "512"
            # Prefix caching forces DeltaNet state snapshots ("align" mode),
            # which cost KV memory
            - --no-enable-prefix-caching
            # Text only. --language-model-only alone still built the vision
            # tower; the hf override is the one that's measured here.
            - --language-model-only
            - --hf-overrides
            - '{"language_model_only": true}'
            # Thinking goes to the reasoning field; tool calls in Qwen3.8's
            # XML format. The wrong tool parser fails silently (calls come
            # back as prose).
            - --reasoning-parser
            - qwen3
            - --enable-auto-tool-choice
            - --tool-call-parser
            - qwen3_coder
            # The checkpoint keeps the MTP head. Not measured: it costs 0.8 GiB
            # of weights plus a 17th attention layer's KV, more than the 0.98
            # headroom over 32k; check vllm:spec_decode_num_accepted_tokens
            # on /metrics if it's ever turned on.
            # - --speculative-config
            # - '{"method":"mtp","num_speculative_tokens":1}'
            #
            # Sampling comes from the checkpoint's generation_config.json
            # (temp 1.0, top-p 0.95, top-k 20: Qwen3.8's thinking-mode
            # recommendation). Requests can still override these.
          env:
            - name: HOME
              value: /tmp
            # torch.compile / Triton kernel caches on the volume, so restarts
            # skip recompiling
            - name: VLLM_CACHE_ROOT
              value: /cache/vllm
            - name: TRITON_CACHE_DIR
              value: /cache/triton
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /cache/inductor
            # UID 10001 has no passwd entry in the image; torch's cache code
            # calls getpass.getuser(), which reads $USER before failing on
            # getpwuid().
            - name: USER
              value: vllm
            - name: FLASH_ATTENTION_TRITON_AMD_ENABLE
              value: "TRUE"
            # Never reach out to the Hub at runtime: serve the local snapshot only
            - name: HF_HUB_OFFLINE
              value: "1"
            # gfx1100 is natively supported - do NOT set HSA_OVERRIDE_GFX_VERSION.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
            limits:
              amd.com/gpu: 1
              memory: 32Gi
          # The init container did the download; this is load, compile and
          # graph capture (slowest on the first start, before the caches exist).
          # /health refuses connections until the engine is up.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
            # The API server and engine core talk over shared memory
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen3-8-27b-cache
        - name: tmp
          emptyDir:
            sizeLimit: 4Gi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
