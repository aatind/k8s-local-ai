---
# llama.cpp (ROCm) serving Qwen3.6-27B (Q6_K GGUF) on one AMD Radeon RX 7900 XTX
# (gfx1100, RDNA3, 24 GiB), with the model's built-in MTP heads plus ngram-mod
# chained in front of them for speculative decoding (unsloth's recommended
# llama.cpp recipe for Qwen3.6: ngram catches verbatim repeats, MTP drafts
# novel tokens; no separate draft GGUF needed).
#
# Why this stack on this card:
#   - NVFP4 weights / fp8 KV need Blackwell / MI300+; gfx1100 has neither,
#     so the target is a plain-quant GGUF (Q6_K, ~21.0 GiB) with quantized KV.
#   - SGLang only supports CDNA (gfx942/gfx950) officially, and the earlier
#     vLLM + AWQ attempt here needed a config patch and capped out at ~24k
#     context (bf16 KV). llama.cpp ships a ROCm image built for gfx1100.
#
# VRAM budget (24 GiB). Q6_K weights are 21.0 GiB - the KV cache
# (131000 tokens, k q5_0 / v q4_0), the MTP heads, the ngram-mod pool
# (~16 MB) and the compute buffers must live in what's left. Tight: if
# llama.cpp fails to allocate on startup, lower --ctx-size first.
#
# Sampling/sampling-adjacent knobs below mirror the requested Qwen3.6-27B
# config verbatim (thinking mode: temp 0.6, top-k 20, top-p 0.95, min-p 0);
# --spec-type draft-mtp,ngram-mod replaces the old DFlash2 drafter, so the
# draft GGUF is gone from the init container too.
#
# The file is pinned to a commit and checked by sha256 (llama.cpp's -hf
# can't pin a revision), so the init container downloads it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8-27b
  namespace: qwen38
  labels:
    app: qwen3-8-27b
spec:
  replicas: 1
  # One GPU, one copy of the weights: stop the old pod before starting a new one
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-8-27b
  template:
    metadata:
      labels:
        app: qwen3-8-27b
    spec:
      nodeSelector:
        amd.com/gpu.device-id: "744c"     # Navi 31 / 7900 XTX
      # Non-root, read-only image. The AMD device plugin passes
      # /dev/kfd and /dev/dri/renderD* in with the host's group ownership,
      # so the pod needs those GIDs (check on the node: getent group render video).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44    # video
          - 991   # render
        # Kept from the previous manifest: AMD recommends unconfined for ROCm
        # (HSA uses NUMA syscalls the default profile restricts).
        seccompProfile:
          type: Unconfined
      terminationGracePeriodSeconds: 60
      initContainers:
        # Downloads the pinned GGUF once (~21 GiB), resumes a partial
        # download, and rejects a file whose sha256 doesn't match.
        # NOTE: the old Qwen3.8-27B Q4_K_M + DFlash2 files (16.4 GiB) on the
        # 30 Gi PVC must be removed once before this download fits; the PVC
        # otherwise fills mid-download. They are re-downloadable and unused now.
        - name: fetch-models
          image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11681
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /cache/models
              fetch() {
                url="$1"; file="/cache/models/$2"; sha="$3"
                if [ -f "$file" ]; then
                  # same filename can exist from another repo (e.g. the
                  # non-MTP build) - checksum decides; move, never delete
                  if echo "$sha  $file" | sha256sum -c - 2>/dev/null; then
                    echo "$2 present, sha ok"; return
                  fi
                  mv "$file" "$file.stale-$(date +%s)"
                  echo "$2 sha mismatch, moved aside as stale"
                fi
                curl -fL --retry 5 -C - -o "$file.partial" "$url"
                echo "$sha  $file.partial" | sha256sum -c -
                mv "$file.partial" "$file"
              }
              fetch https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF/resolve/5cb35eb3dcbf52dbce5f87dbc64df6aaffadcace/Qwen3.6-27B-Q6_K.gguf \
                Qwen3.6-27B-Q6_K.gguf \
                773f1bf0be0589d056ce05476a8a135b50494a3f2ecc3f8f0c4f2c3594bba02e
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      containers:
        - name: llama-server
          # Official llama.cpp ROCm 7.2.1 build; its target list includes
          # gfx1100. Pinned build (2026-10-16) - new enough for Qwen3.6,
          # draft-mtp and ngram-mod (the draft-mtp rename landed 2026-05-13).
          image: ghcr.io/ggml-org/llama.cpp:server-rocm-b11681
          args:
            - --model
            - /cache/models/Qwen3.6-27B-Q6_K.gguf
            # The model name clients send. NOTE: renamed from qwen3.8-27b -
            # clients must request "Qwen3.6-27B-Q6_K" now (hermes local27b
            # alias sends qwen3.8-27b; update or expect 404 model-not-found).
            - --alias
            - Qwen3.6-27B-Q6_K
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Everything on the GPU, and no auto-fitting: with --fit on,
            # llama.cpp quietly moves layers to the CPU when VRAM runs short.
            # Fail loudly instead, then lower -c.
            - --n-gpu-layers
            - "999"
            - --fit
            - "off"
            - --ctx-size
            - "131000"
            # Quantized V cache needs flash attention
            - --flash-attn
            - "on"
            - --cache-type-k
            - q5_0
            - --cache-type-v
            - q4_0
            # KV caches for the MTP draft pass (draft-mtp heads share the
            # target's context graph)
            - --cache-type-k-draft
            - q4_0
            - --cache-type-v-draft
            - q4_0
            # Prompt cache off: single user, and every GiB of pinned host
            # RAM matters with mlock + 21 GiB of weights
            - --cache-ram
            - "0"
            # cache-idle-slots false: the flag defaults to enabled, so it
            # must be disabled explicitly (presence-only pair)
            - --no-cache-idle-slots
            # One user, one slot: the whole KV pool goes to that request
            - --parallel
            - "1"
            # Pin weights; no silent page-cache eviction under memory pressure.
            # (b11681: --mlock is gone - it's a --load-mode value; bool flags
            #  are presence-only pairs, and --reasoning takes on/off/auto.)
            - --load-mode
            - mlock
            # Text-only: don't load the vision mmproj
            - --no-mmproj
            # Chat template (and its reasoning/tool-call tags) from the GGUF
            - --jinja
            # Thinking on: reasoning goes to reasoning_content
            - --reasoning
            - "on"
            # Two-stage speculation: ngram-mod drafts verbatim continuations,
            # the model's MTP heads draft the rest; MTP drafts 2 tokens,
            # ngram-mod keeps drafts between 8 and 32 after a 24-token match.
            - --spec-type
            - draft-mtp,ngram-mod
            - --spec-draft-n-max
            - "2"
            - --spec-ngram-mod-n-match
            - "24"
            - --spec-ngram-mod-n-min
            - "8"
            - --spec-ngram-mod-n-max
            - "32"
            # Qwen3.6's recommended thinking-mode sampling (model card);
            # llama.cpp's defaults differ (temp 0.8, top-k 40, min-p 0.05).
            # Requests can still override these.
            - --temp
            - "0.6"
            - --top-p
            - "0.95"
            - --top-k
            - "20"
            - --min-p
            - "0.0"
            - --presence-penalty
            - "0.0"
            - --repeat-penalty
            - "1.0"
          env:
            - name: HOME
              value: /tmp
            # gfx1100 is natively supported - do NOT set HSA_OVERRIDE_GFX_VERSION.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # mlock() the 21 GiB of weights past RLIMIT_MEMLOCK
              # (--load-mode mlock; without it the lock fails and is skipped)
              add: ["IPC_LOCK"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # mlock pins the 21 GiB of weights in host RAM (not reclaimable
          # page cache), so request the real footprint instead of 8Gi.
          resources:
            requests:
              cpu: "4"
              memory: 24Gi
            limits:
              amd.com/gpu: 1
              memory: 32Gi
          # The init container did the download; this is load only.
          # /health is 503 while loading, 200 once ready.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: qwen3-8-27b-cache
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
