---
apiVersion: v1
kind: ConfigMap
metadata:
  name: radiance-config
  namespace: qwen38
data:
  radiance.yaml: |
    memory:
      gpu-headroom-mib: 160
    scheduler:
      load-timeout: 600s
    server:
      port: 8000
      host: "::"
      api-key-env: davdav
    models:
      qwen3-8-27b:
        model: /models/qwen3.8-27b-iq4r-l-v4.rad
        tp: 1
        max-num-seqs: 2
        max-model-len: 250000
        kv-cache-dtype: i8
