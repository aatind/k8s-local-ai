---
# Pinned GGUFs for qwen3-8-27b (target ~15.3 GiB + DFlash2 draft ~1.1 GiB).
# local-path: lives on the node's 143 GiB NVMe, shared with containerd's images.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-8-27b-cache
  namespace: qwen38
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
