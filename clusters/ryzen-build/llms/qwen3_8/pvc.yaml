---
# Pinned qwen3-8-27b snapshot (~19.6 GiB) plus vLLM/Triton compile caches.
# local-path: lives on the node's 143 GiB NVMe, shared with containerd's images.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-8-27b-cache
  namespace: qwen38
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
