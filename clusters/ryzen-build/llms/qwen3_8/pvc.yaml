---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  namespace: qwen38
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
# Pinned GGUFs for qwen3-8-27b (target ~15.3 GiB + DFlash2 draft ~1.1 GiB).
# Fresh volume, so the non-root pod owns it (hf-cache above holds root-owned
# files from the earlier vLLM runs).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-8-27b-cache
  namespace: qwen38
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 30Gi
