---
# OpenAI-compatible API, /v1:
#   in-cluster: http://qwen3-8-27b.qwen38.svc:8000/v1
#   LAN:        http://<node-ip>:30800/v1 (fixed NodePort, any node's IP)
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8-27b
  namespace: qwen38
  labels:
    app: qwen3-8-27b
spec:
  type: NodePort
  selector:
    app: qwen3-8-27b
  ports:
    - name: http
      port: 8000
      targetPort: http
      # Fixed so clients' base URL survives a re-create (range 30000-32767)
      nodePort: 30800
      protocol: TCP
